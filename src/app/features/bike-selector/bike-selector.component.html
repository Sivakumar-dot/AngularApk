<div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8">
  <div class="flex flex-col gap-4 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Select Your Bike</h1>
      <p class="text-sm text-slate-500">Choose a model to see compatible parts.</p>
    </div>
    <input
      class="w-full max-w-sm rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"
      type="text"
      placeholder="Search bikes (UI only)"
      [(ngModel)]="search"
    />
  </div>

  <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    <div
      *ngFor="let bike of bikes"
      class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
    >
      <div class="relative aspect-video overflow-hidden">
        <img
          [src]="bike.image"
          [alt]="bike.name"
          class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
          loading="lazy"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/40 via-transparent"></div>
      </div>
      <div class="p-6">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ bike.segment }}</p>
        <h3 class="mt-2 text-lg font-semibold text-slate-900">{{ bike.name }}</h3>
        <button
          class="mt-6 w-full rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800"
          (click)="selectBike(bike)"
        >
          Select Bike
        </button>
      </div>
    </div>
  </div>
</div>
