<div class="mx-auto max-w-5xl px-4 py-8">
  <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Your Cart</h1>
    <p class="mt-2 text-sm text-slate-500">Review selected items before checkout.</p>
  </div>

  <div class="mt-6 grid gap-6" *ngIf="cartView$ | async as cartView">
    <div
      class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm"
      *ngFor="let item of cartView.items"
    >
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-4">
          <img
            *ngIf="item.product"
            [src]="item.product.image"
            [alt]="item.product.name"
            class="h-20 w-24 rounded-2xl object-cover"
            loading="lazy"
          />
          <div>
            <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ item.product?.brand }}</p>
            <h3 class="text-lg font-semibold text-slate-900">{{ item.product?.name }}</h3>
            <p class="text-sm text-slate-500">?{{ item.product?.price | number: '1.0-0' }}</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button mat-stroked-button color="primary" (click)="decrement(item.product?.id ?? 0, item.quantity)">
            -
          </button>
          <span class="w-8 text-center text-sm font-semibold">{{ item.quantity }}</span>
          <button mat-stroked-button color="primary" (click)="increment(item.product?.id ?? 0, item.quantity)">
            +
          </button>
        </div>
        <div class="text-right text-lg font-semibold text-slate-900">
          ?{{ item.lineTotal | number: '1.0-0' }}
        </div>
      </div>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-slate-900 p-6 text-white shadow-lg">
      <div class="flex items-center justify-between">
        <p class="text-sm uppercase tracking-[0.2em] text-slate-300">Total</p>
        <p class="text-2xl font-semibold">?{{ cartView.total | number: '1.0-0' }}</p>
      </div>
      <button mat-flat-button color="accent" class="mt-4 w-full">
        Checkout (UI only)
      </button>
    </div>
  </div>
</div>
