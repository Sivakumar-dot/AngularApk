<div class="mx-auto flex max-w-6xl flex-col gap-10 px-4 py-8">
  <section class="rounded-[32px] bg-gradient-to-br from-slate-900 via-slate-800 to-slate-700 p-8 text-white shadow-xl">
    <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
      <div class="space-y-3">
        <p class="text-sm uppercase tracking-[0.3em] text-slate-300">Welcome</p>
        <h1 class="text-3xl font-semibold md:text-4xl">Hey {{ userName }}, keep your bike in peak condition.</h1>
        <p class="text-slate-200">Search parts, pick your bike, and build your cart in minutes.</p>
      </div>
      <div class="w-full max-w-sm rounded-2xl bg-white/10 p-4">
        <label class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-300">Search</label>
        <input
          type="text"
          placeholder="Search parts, brands, categories"
          class="mt-2 w-full rounded-xl bg-white/10 px-4 py-3 text-sm text-white placeholder:text-slate-300"
        />
      </div>
    </div>
  </section>

  <section class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold text-slate-900">Select Your Bike</h2>
      <a class="text-sm font-semibold text-slate-500 hover:text-slate-700" routerLink="/bikes">View all bikes</a>
    </div>
    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
      <div
        *ngFor="let bike of bikes"
        class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg"
      >
        <div class="relative aspect-video overflow-hidden">
          <img
            [src]="bike.image"
            [alt]="bike.name"
            class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
            loading="lazy"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900/40 via-transparent"></div>
        </div>
        <div class="p-6">
          <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ bike.name }}</p>
          <h3 class="mt-2 text-lg font-semibold text-slate-900">{{ bike.description }}</h3>
          <button
            class="mt-6 w-full rounded-full border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
            routerLink="/bikes"
          >
            Select Bike
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="space-y-4">
    <h2 class="text-xl font-semibold text-slate-900">Popular Categories</h2>
    <div class="grid gap-4 md:grid-cols-3">
      <div
        *ngFor="let category of categories"
        class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
      >
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ category.name }}</p>
        <h3 class="mt-2 text-lg font-semibold text-slate-900">{{ category.count }}</h3>
      </div>
    </div>
  </section>

  <section class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-semibold text-slate-900">Recommended Products</h2>
      <a class="text-sm font-semibold text-slate-500 hover:text-slate-700" routerLink="/products">Browse all</a>
    </div>
    <div class="flex gap-4 overflow-x-auto pb-2">
      <div class="min-w-[260px]" *ngFor="let product of (products$ | async) | slice:0:6">
        <app-product-card [product]="product"></app-product-card>
      </div>
    </div>
  </section>
</div>
