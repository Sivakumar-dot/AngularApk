<div class="mx-auto max-w-5xl px-4 py-8" *ngIf="product$ | async as product">
  <div class="grid gap-8 rounded-[32px] border border-slate-200 bg-white p-6 shadow-lg lg:grid-cols-2">
    <div class="relative overflow-hidden rounded-3xl bg-slate-100 shadow-sm">
      <img [src]="product.image" [alt]="product.name" class="h-full w-full object-cover" loading="lazy" />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-900/25 via-transparent"></div>
    </div>
    <div class="space-y-5">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ product.brand }}</p>
        <h1 class="text-3xl font-semibold text-slate-900">{{ product.name }}</h1>
        <div class="mt-2 flex items-center gap-3">
          <span class="text-xl font-semibold text-slate-900">?{{ product.price | number: '1.0-0' }}</span>
          <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">? {{ product.rating }}</span>
        </div>
      </div>
      <div>
        <p class="text-sm font-semibold text-slate-700">Compatibility</p>
        <ul class="mt-2 flex flex-wrap gap-2">
          <li
            *ngFor="let bike of product.compatibleBikes"
            class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600"
          >
            {{ bike }}
          </li>
        </ul>
      </div>
      <div>
        <p class="text-sm font-semibold text-slate-700">Description</p>
        <p class="mt-2 text-sm text-slate-500">{{ product.description }}</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <button mat-flat-button color="primary" (click)="addToCart(product.id)">
          Add to Cart
        </button>
        <a mat-stroked-button color="primary" routerLink="/products">
          Back to Products
        </a>
      </div>
    </div>
  </div>
</div>
