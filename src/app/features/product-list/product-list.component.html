<div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8">
  <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Products</h1>
    <p class="mt-2 text-sm text-slate-500">Showing parts compatible with {{ selectedBike }}.</p>
  </div>

  <app-filters
    [categories]="(categories$ | async) || []"
    [brands]="(brands$ | async) || []"
    (categoryChange)="onCategoryChange($event)"
    (brandChange)="onBrandChange($event)"
  ></app-filters>

  <div class="grid gap-4 md:grid-cols-3">
    <app-product-card
      *ngFor="let product of (products$ | async)"
      [product]="product"
      [selectedBike]="selectedBike"
    ></app-product-card>
  </div>
</div>
