<div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Users</h1>
      <p class="text-sm text-slate-500">Manage application users and roles.</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>person_add</mat-icon>
      Create User
    </button>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm mat-elevation-z8">
    <table mat-table [dataSource]="users" class="bp-table">
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef>First Name</th>
        <td mat-cell *matCellDef="let user">{{ user.firstName }}</td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Last Name</th>
        <td mat-cell *matCellDef="let user">{{ user.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="mobile">
        <th mat-header-cell *matHeaderCellDef>Mobile</th>
        <td mat-cell *matCellDef="let user">{{ user.mobile }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">{{ roleName(user.roleId) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <span class="bp-actions">
            <button
              mat-icon-button
              matTooltip="Edit"
              class="bp-icon-btn edit"
              (click)="openEdit(user)"
            >
              <fa-icon [icon]="faPen"></fa-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Delete"
              class="bp-icon-btn delete"
              (click)="confirmDelete(user)"
            >
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
