<div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Roles</h1>
      <p class="text-sm text-slate-500">Control role definitions for your team.</p>
    </div>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Create Role
    </button>
  </div>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm mat-elevation-z8">
    <table mat-table [dataSource]="roles" class="bp-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Role Name</th>
        <td mat-cell *matCellDef="let role">{{ role.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let role">{{ role.description }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let role">
          <span class="bp-actions">
            <button
              mat-icon-button
              matTooltip="Edit"
              class="bp-icon-btn edit"
              (click)="openEdit(role)"
            >
              <fa-icon [icon]="faPen"></fa-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Delete"
              class="bp-icon-btn delete"
              (click)="confirmDelete(role)"
            >
              <fa-icon [icon]="faTrash"></fa-icon>
            </button>
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
