<div class="group flex h-full flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
  <div class="relative aspect-video bg-slate-100">
    <div class="absolute inset-0 animate-pulse bg-slate-200"></div>
    <img
      class="relative h-full w-full object-cover transition duration-300 group-hover:scale-105"
      [src]="product.image"
      [alt]="product.name"
      loading="lazy"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/45 via-transparent"></div>
    <span class="absolute left-3 top-3 rounded-full bg-amber-400 px-3 py-1 text-xs font-semibold text-slate-900">
      Recommended
    </span>
    <div class="absolute right-3 top-3 rounded-full bg-white/90 px-2 py-1 text-xs font-semibold text-slate-700 shadow">
      ? {{ product.rating.toFixed(1) }}
    </div>
  </div>
  <div class="flex flex-1 flex-col gap-3 p-4">
    <div>
      <p class="text-xs uppercase tracking-[0.2em] text-slate-400">{{ product.brand }}</p>
      <h3 class="text-lg font-semibold text-slate-900">{{ product.name }}</h3>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-lg font-semibold text-slate-900">?{{ product.price | number: '1.0-0' }}</span>
      <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">
        Compatible with {{ selectedBike || product.compatibleBikes[0] }}
      </span>
    </div>
    <button
      mat-flat-button
      color="primary"
      class="mt-auto w-full"
      [routerLink]="['/product', product.id]"
    >
      View Details
    </button>
  </div>
</div>
