<mat-toolbar color="primary" class="shadow-sm">
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-4 px-2 py-1">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-white/15 text-white">
        <span class="text-lg font-bold">BP</span>
      </div>
      <div>
        <p class="text-xs uppercase tracking-[0.3em] text-white/70">Bike Parts</p>
        <p class="text-lg font-semibold text-white">Spare Parts Hub</p>
      </div>
    </div>

    <nav class="flex flex-1 flex-wrap items-center gap-2 text-sm font-medium text-white/90">
      <a class="rounded-full px-3 py-1.5 transition hover:bg-white/10" routerLink="/home">Home</a>
      <a class="rounded-full px-3 py-1.5 transition hover:bg-white/10" routerLink="/bikes">Bikes</a>
      <a class="rounded-full px-3 py-1.5 transition hover:bg-white/10" routerLink="/products">Products</a>
      <a class="rounded-full px-3 py-1.5 transition hover:bg-white/10" routerLink="/cart">Cart</a>
    </nav>

    <div class="flex items-center gap-3">
      <div class="rounded-full bg-white/15 px-3 py-1 text-xs font-semibold text-white/90">
        Logged in: {{ userName }}
      </div>
      <button mat-stroked-button color="accent" (click)="logout()">Logout</button>
    </div>
  </div>
</mat-toolbar>
